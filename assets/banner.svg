<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Guillermo Willard — Desarrollador de software">
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    .fade { opacity: 0; animation: fade .8s ease-out forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .4s; } .d3 { animation-delay: .7s; }
    .line { transform-origin: 80px 0; transform: scaleX(0); animation: grow .9s .3s ease-out forwards; }
    .type { animation: type 2.6s 1.1s steps(44) forwards; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes type { from { width: 0; } to { width: 700px; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <clipPath id="typed"><rect class="type" x="80" y="214" width="0" height="40"/></clipPath>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#F6F3E9" opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="#1D1E21"/>
  <rect x="760" width="440" height="300" fill="url(#dots)"/>

  <!-- tarjeta de código -->
  <g transform="translate(790 62)">
    <g class="fade d3 mono" font-size="15.5">
      <rect width="330" height="176" rx="12" fill="#26272B" stroke="#B18845" stroke-opacity=".35"/>
      <circle cx="22" cy="20" r="5" fill="#B18845"/><circle cx="40" cy="20" r="5" fill="#F6F3E9" opacity=".35"/><circle cx="58" cy="20" r="5" fill="#F6F3E9" opacity=".18"/>
      <text x="22" y="58" fill="#F6F3E9" opacity=".55">val <tspan fill="#F6F3E9" opacity="1">guillermo</tspan> = Dev(</text>
      <text x="40" y="84" fill="#F6F3E9" opacity=".8">stack = <tspan fill="#B18845">"Kotlin, Java"</tspan>,</text>
      <text x="40" y="108" fill="#F6F3E9" opacity=".8">marca = <tspan fill="#B18845">"NissiDev"</tspan>,</text>
      <text x="40" y="132" fill="#F6F3E9" opacity=".8">busco = <tspan fill="#B18845">"prácticas"</tspan></text>
      <text x="22" y="156" fill="#F6F3E9" opacity=".55">)</text>
    </g>
  </g>

  <g class="sans">
    <text x="80" y="88" font-size="17" letter-spacing="4" fill="#B18845" class="fade d1">HOLA, SOY</text>
    <text x="78" y="148" font-size="56" font-weight="700" fill="#F6F3E9" class="fade d1">Guillermo Willard</text>
    <rect x="80" y="166" width="120" height="4" rx="2" fill="#B18845" class="line"/>
    <text x="80" y="200" font-size="21" fill="#F6F3E9" opacity=".78" class="fade d3">Desarrollador de software · Android · Spring Boot · React</text>
  </g>

  <g class="mono" font-size="18">
    <g clip-path="url(#typed)">
      <text x="80" y="242" fill="#B18845">&gt;</text>
      <text x="100" y="242" fill="#F6F3E9" opacity=".9">construyendo software que impulsa negocios</text>
    </g>
    <rect x="553" y="228" width="10" height="19" fill="#B18845" class="cursor"/>
  </g>
</svg>
